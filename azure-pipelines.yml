trigger:
- main

pool:
  name: 'SelfHostedPool'

variables:
  terraformVersion: '1.6.6'
  workingDirectory: 'Environments/Dev'

stages:

# ============================================================
# STAGE 1: TERRAFORM INIT (SCRIPT)
# ============================================================
- stage: Init
  jobs:
  - job: InitJob
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform init \
          -backend-config="resource_group_name=devbackendRG" \
          -backend-config="storage_account_name=devbackendstorage12345" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=dev.tfstate" \
          -backend-config="sas_token=$(backend_sas)"
      displayName: "Terraform Init (Script)"


# ============================================================
# STAGE 2: PLAN
# ============================================================
- stage: Plan
  dependsOn: Init
  jobs:
  - job: PlanJob
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform plan -var-file="dev.tfvars"
      displayName: "Terraform Plan"


# ============================================================
# STAGE 3: APPLY
# ============================================================
- stage: Apply
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: ApplyJob
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform apply -var-file="dev.tfvars" -auto-approve
      displayName: "Terraform Apply"
