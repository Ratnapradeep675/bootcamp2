trigger:
- main

pool:
  name: 'SelfHostedPool'

variables:
  terraformVersion: '1.6.6'
  workingDirectory: '$(Pipeline.Workspace)/s/Environments/Dev'

stages:

# ============================================================
# STAGE 1: TERRAFORM INIT (SCRIPT)
# ============================================================
- stage: Init
  displayName: "Terraform Init"
  jobs:
  - job: InitJob
    displayName: "Init Job"
    steps:

    - checkout: self
      path: s

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform init \
          -backend-config="resource_group_name=devbackendRG" \
          -backend-config="storage_account_name=devbackendstorage12345" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=dev.tfstate" \
          -backend-config="sas_token=$(backend_sas)"
      displayName: "Terraform Init (Script)"


# ============================================================
# STAGE 2: TERRAFORM PLAN (SCRIPT)
# ============================================================
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Init
  jobs:
  - job: PlanJob
    displayName: "Plan Job"
    steps:

    - checkout: self
      path: s

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform plan -var-file="dev.tfvars"
      displayName: "Terraform Plan"


# ============================================================
# STAGE 3: TERRAFORM APPLY (SCRIPT)
# ============================================================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: ApplyJob
    displayName: "Apply Job"
    steps:

    - checkout: self
      path: s

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        cd $(workingDirectory)
        terraform apply -var-file="dev.tfvars" -auto-approve
      displayName: "Terraform Apply"
