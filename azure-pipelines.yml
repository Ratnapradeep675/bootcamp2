trigger:
- main

pool:
  name: 'SelfHostedPool'

variables:
  terraformVersion: '1.6.6'
  workingDirectory: 'Modules/Aks'
  serviceConnection: 'terraform-azure-connection'

stages:

# ============================================================
# STAGE 1: TERRAFORM INIT
# ============================================================
- stage: Init
  displayName: "Terraform Init"
  jobs:
  - job: TerraformInit
    displayName: "Init Job"
    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'devbackendRG'
        backendAzureRmStorageAccountName: 'devbackendstorage12345'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.tfstate'


# ============================================================
# STAGE 2: TERRAFORM PLAN
# ============================================================
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Init
  jobs:
  - job: TerraformPlan
    displayName: "Plan Job"
    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'


# ============================================================
# STAGE 3: TERRAFORM APPLY
# ============================================================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - job: TerraformApply
    displayName: "Apply Job"
    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'
